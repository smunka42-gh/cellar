name: Daily refresh

# Rebuilds the site from fresh prices each weekday evening (after the US close)
# and redeploys it to GitHub Pages. Also runnable on demand from the Actions tab.
#
# IMPORTANT — why this is prices-only: SEC (data.sec.gov and www.sec.gov) blocks
# GitHub Actions' datacenter IPs, so the SEC-derived measures (M4 quality, M5
# mispricing, M6 cheap-on-earnings, M7 the hoarding floor) and SEC filings CANNOT
# be pulled here. They change slowly and ship as a committed snapshot
# (data/results_dip.json, data/filings.json), refreshed locally where SEC works.
# Prices DO work in CI (yfinance) and are the daily-critical input, so this job
# refreshes prices and recomputes only the price-based measures (M1-M3), plus the
# yfinance-sourced profiles/analyst ratings, then rebuilds and deploys.

on:
  schedule:
    - cron: '30 22 * * 1-5'      # 22:30 UTC, Mon-Fri (~after the 4pm ET close)
  workflow_dispatch:

permissions:
  contents: write                 # to force-push the gh-pages branch

concurrency:
  group: cellar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/prices
            data/splits
            data/market_cap.json
            data/info.json
          key: cellar-prices-${{ github.run_id }}
          restore-keys: |
            cellar-prices-

      - name: Refresh prices (incremental, or full on first run)
        run: |
          if [ ! -d data/prices ] || [ "$(ls data/prices 2>/dev/null | wc -l)" -lt 100 ]; then
            echo "::notice::price cache empty — full price pull (one-time)"
            python scripts/pull.py prices
            python scripts/pull.py mcap
          else
            echo "::notice::cache present — incremental price refresh"
            python scripts/refresh_prices.py
          fi

      - name: Save price cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/prices
            data/splits
            data/market_cap.json
            data/info.json
          key: cellar-prices-${{ github.run_id }}

      - name: Refresh profiles + analyst ratings (weekly)
        run: |
          if [ ! -f data/info.json ] || [ $(( ($(date +%s) - $(stat -c %Y data/info.json 2>/dev/null || echo 0)) / 86400 )) -ge 6 ]; then
            echo "::notice::info stale or missing — pulling profiles + analyst ratings"
            python scripts/pull_info.py
          else
            echo "info fresh (< 6 days) — skipping"
          fi

      - name: Recompute price measures (M1-M3) on the fundamentals snapshot
        run: python scripts/refresh_measures.py

      - name: Build the site
        run: python scripts/build_mock.py

      - name: Sanity guard — refuse to deploy a degraded build
        run: |
          n=$(python -c "import json;print(len(json.load(open('data/results_dip.json'))))")
          echo "companies in build: $n"
          if [ "$n" -lt 1300 ]; then
            echo "::error::only $n companies — build looks degraded, aborting deploy (live site unchanged)"
            exit 1
          fi

      - name: Deploy to GitHub Pages (gh-pages branch)
        run: |
          mkdir -p /tmp/site && cp data/mock.html /tmp/site/index.html
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name  "smunka42-gh"
          git config user.email "295261357+smunka42-gh@users.noreply.github.com"
          git add index.html
          git commit -q -m "Deploy $(date -u +%Y-%m-%d)"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
